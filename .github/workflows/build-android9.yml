name: Build LineageOS 16.0

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename (lunch 目标)'
        required: true
        default: 'c7ltechn'
      target:
        description: '构建目标（bacon 全量 / bootimage 快速验证）'
        required: false
        default: 'bacon'
      manifest:
        description: '本地 manifest，相对仓库根目录'
        required: true
        default: 'manifest/c7ltechn.xml'
      runner:
        description: 'Runner 类型（Android 9 需 Java 8，必须用 22.04。免费账户无 Larger Runner，只能用 ubuntu-22.04）'
        required: true
        default: 'ubuntu-22.04'
        type: choice
        options:
          - ubuntu-22.04
      build_jobs:
        description: '并行编译任务数 (-j)。免费 runner 为 2 核/7GB，-j4 会因内存不足挂起，建议 2'
        required: false
        default: '2'
  push:
    branches: [main]
    paths: ['.github/**', 'manifest/**', 'scripts/**', 'device/**', 'kernel/**']

jobs:
  build:
    # Android 9 (LOS 16.0) 需要 Java 8，官方 22.04 镜像自带。
    # ubuntu-22.04 免费 runner 为 2 核/7GB；全量编译约 3-5h，6h 超时内
    # 可行，但 -j4 会内存不足挂起，必须 -j2 + swap（见 Add swap 步骤）。
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 360
    env:
      LOS_BRANCH: lineage-16.0
      DEVICE: ${{ inputs.device || 'c7ltechn' }}
      MANIFEST: ${{ inputs.manifest || 'manifest/c7ltechn.xml' }}
      TARGET: ${{ inputs.target || 'bacon' }}
      BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
      SYNC_JOBS: '4'
      C7_EXTRACT_URL: https://github.com/AwdndWindowsServer/C7-Lineageos1/releases/download/shs/c7extract.zip
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/swift /usr/lib/mono \
            /usr/local/lib/node_modules /root/.cargo /root/.rustup \
            /opt/hostedtoolcache /usr/local/.ghcup /opt/az /opt/microsoft \
            /usr/local/share/geckodriver /usr/local/lib/python3.*/site-packages/cv2
          sudo apt-get clean
          docker image prune -af || true
          sudo swapoff /mnt/swapfile 2>/dev/null || true
          df -h / | tail -1

      # 实测结论（关键！）：free runner 7GB RAM + 3GB 自带 swap。
      # 1) 手动加 8GB swap → swap 风暴静默挂死（glob 阶段大量内存被压进慢 swap）
      # 2) swappiness=10（尽量不用 swap）→ 内存满时直接 OOM，编译 0-1% 被杀
      # 正确做法：保留系统自带 3GB swap，swappiness 用默认 60（j7 用默认跑通 2h+ 到 64%）
      - name: Tune swap (验证默认 swappiness)
        run: |
          free -h
          swapon --show || true
          sudo sysctl -w vm.swappiness=60 || true
          cat /proc/sys/vm/swappiness

      - name: Install build dependencies (Ubuntu 22.04 / Android 9)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libtinfo5 libxml2 libxml2-utils lzop openjdk-8-jdk pngcrush python2.7 \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev || true
          # AOSP9 预编译 clang/gcc 需要老版本库：libncurses.so.5 只在 22.04 以 .6 存在，
          # 用 ABI 兼容的 symlink 补齐（libtinfo.so.5 由 libtinfo5 包提供）
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncursesw.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          # Android 9 仍需要 python2
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2 || true
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python || true
          # repo 工具
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Build
        run: |
          # 独立资源监控：脱离 build.sh 进程树，即使脚本被强杀也能记录
          nohup bash -c 'while true; do echo "$(date -u +%H:%M:%S) mem=$(free -m | awk "/Mem:/{printf \"%d/%d\", \$7, \$2}") swap=$(free -m | awk "/Swap:/{printf \"%d\", \$3}") procs=$(ps -e --no-headers | wc -l) load=$(cut -d" " -f1-3 /proc/loadavg)" >> /tmp/wfmon.log 2>&1; sleep 15; done' >/dev/null 2>&1 &
          bash scripts/build.sh

      - name: Diagnose on failure
        if: always()
        run: |
          {
            echo "=== workflow 独立监控日志 ==="
            cat /tmp/wfmon.log 2>/dev/null | tail -40 || true
            echo "=== dmesg (OOM 痕迹) ==="
            sudo dmesg 2>/dev/null | tail -25 || true
            echo "=== 磁盘 ==="
            df -h / 2>/dev/null | tail -2
            echo "=== 顶层内存进程 ==="
            ps aux --sort=-%mem 2>/dev/null | head -8
          } | tee /tmp/diag.txt
          # 归档诊断供后续下载
          mkdir -p "$GITHUB_WORKSPACE/diag" && cp /tmp/diag.txt "$GITHUB_WORKSPACE/diag/" 2>/dev/null || true
          echo "诊断输出已写到 diag.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-logs
          path: diag/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineage-16-${{ env.DEVICE }}
          path: |
            android/out/target/product/${{ env.DEVICE }}/lineage_*.zip
            android/out/target/product/${{ env.DEVICE }}/recovery.img
            android/out/target/product/${{ env.DEVICE }}/boot.img
          if-no-files-found: warn
          retention-days: 7
