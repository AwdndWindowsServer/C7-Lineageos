name: Build LineageOS for SM-C7000
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core repo gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
          bc cpio rsync

    - name: Download LineageOS source (depth 1)
      run: |
        mkdir -p ~/android/lineage
        cd ~/android/lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
        repo sync -c -j4 --no-clone-bundle --no-tags

    - name: Download and extract device/vendor
      run: |
        cd ~/android/lineage
        wget -O c7lte.tar.gz https://github.com/AwdndWindowsServer/C7-Lineageos1/releases/download/gg/c7lte_device_and_vendor.tar.gz
        tar -xzf c7lte.tar.gz

    - name: Fix device tree for Samsung C7
      run: |
        cd ~/android/lineage/device/samsung/c7ltechn

        # 创建 AndroidProducts.mk
        cat > AndroidProducts.mk << 'EOF'
        PRODUCT_MAKEFILES := $(LOCAL_DIR)/lineage_c7ltechn.mk
        COMMON_LUNCH_CHOICES := lineage_c7ltechn-userdebug
        EOF

        # 重写 device.mk（完全自包含，不依赖外部 common）
        cat > device.mk << 'EOF'
        $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
        
        # Audio
        PRODUCT_PACKAGES += audio.primary.msm8953 audio.r_submix.default audio.usb.default
        PRODUCT_PACKAGES += libaudio-resampler libqcomvisualizer libqcomvoiceprocessing libqcompostprocbundle
        
        # Camera
        PRODUCT_PACKAGES += libmm-qcamera Snap
        
        # Display
        PRODUCT_PACKAGES += libdisplayconfig libhwc2on1adapter libqdMetaData libqdutils libsdm-disp-apis libsdmutils
        
        # GPS
        PRODUCT_PACKAGES += libgnsspps libloc_core libloc_ds_api liblocation_api libqmi_cci libqmi_common_so libqmi_csi libqmi_encdec libqmi_qmux libqmiservices
        
        # Sensors
        PRODUCT_PACKAGES += libsensor1 libsensor_reg sensors.msm8953
        
        # WiFi
        PRODUCT_PACKAGES += hostapd libwifi-hal-qcom wpa_supplicant wpa_supplicant.conf
        
        # Power
        PRODUCT_PACKAGES += power.qcom
        
        # Init scripts (fstab)
        PRODUCT_COPY_FILES += $(LOCAL_PATH)/rootdir/etc/fstab.qcom:$(TARGET_COPY_OUT_VENDOR)/etc/fstab.qcom
        
        # Overlays
        DEVICE_PACKAGE_OVERLAYS += device/samsung/c7ltechn/overlay
        
        # USB VID/PID
        PRODUCT_DEFAULT_PROPERTY_OVERRIDES += ro.usb.vid=04e8 ro.usb.pid=6860
        EOF

        # 重写 lineage_c7ltechn.mk
        cat > lineage_c7ltechn.mk << 'EOF'
        $(call inherit-product, device/samsung/c7ltechn/device.mk)
        $(call inherit-product, vendor/lineage/config/common_full_phone.mk)
        
        PRODUCT_DEVICE := c7ltechn
        PRODUCT_NAME := lineage_c7ltechn
        PRODUCT_BRAND := samsung
        PRODUCT_MODEL := SM-C7000
        PRODUCT_MANUFACTURER := samsung
        
        PRODUCT_BUILD_PROP_OVERRIDES += TARGET_DEVICE=c7ltechn PRODUCT_NAME=c7ltechn
        BUILD_FINGERPRINT := "samsung/c7ltechn/c7ltechn:8.0.0/R16NW/C7000ZCU2BRB3:user/release-keys"
        
        $(call inherit-product, vendor/samsung/c7ltechn/c7ltechn-vendor.mk)
        EOF

        # 修复 BoardConfig.mk
        # 1. 支持64位应用
        # 2. SELinux permissive
        # 3. 移除 sepolicy 引用
        if ! grep -q "TARGET_SUPPORTS_64_BIT_APPS" BoardConfig.mk; then
          echo "TARGET_SUPPORTS_64_BIT_APPS := true" >> BoardConfig.mk
        fi
        if ! grep -q "BOARD_KERNEL_CMDLINE.*selinux=permissive" BoardConfig.mk; then
          echo "BOARD_KERNEL_CMDLINE += androidboot.selinux=permissive" >> BoardConfig.mk
          echo "SELINUX_IGNORE_NEVERALLOWS := true" >> BoardConfig.mk
        fi
        sed -i 's/^BOARD_SEPOLICY_DIRS/#BOARD_SEPOLICY_DIRS/g' BoardConfig.mk
        
        # 创建缺失的 vendor 目录避免 find 报错
        mkdir -p ~/android/lineage/vendor/samsung/c7ltechn/proprietary/vendor 2>/dev/null || true
        
        # 清空 vendorsetup.sh 消除警告
        echo "# Legacy file - lunch choices are now in AndroidProducts.mk" > vendorsetup.sh

    - name: Build ROM
      run: |
        cd ~/android/lineage
        source build/envsetup.sh
        breakfast c7ltechn
        brunch c7ltechn

    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: lineage-18.1-c7ltechn
        path: ~/android/lineage/out/target/product/c7ltechn/*.zip
