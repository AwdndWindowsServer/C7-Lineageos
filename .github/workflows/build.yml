name: Build LineageOS 18.1 for Samsung SM-C7000 (c7ltechn)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build LineageOS 18.1
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          df -h

      - name: Configure swap space
        run: |
          if ! sudo swapon --show | grep -q '/swapfile'; then
            if [ -e /swapfile ]; then
              sudo swapoff /swapfile 2>/dev/null || true
              sudo rm -f /swapfile
            fi
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core repo gnupg flex bison gperf \
            build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 bc cpio rsync openjdk-11-jdk

      - name: Install repo tool
        run: |
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          repo --version

      - name: Configure git
        run: |
          git config --global user.name "CI Builder"
          git config --global user.email "ci@localhost"
          git config --global color.ui false

      - name: Initialize LineageOS 18.1 source
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 \
            --depth=1 --no-clone-bundle --no-tags

      - name: Sync LineageOS 18.1 source
        run: |
          repo sync -c -j4 --no-clone-bundle --no-tags

      - name: Clone kernel source (Samsung 3.18, oreo branch)
        run: |
          git clone --depth=1 -b oreo https://github.com/ai94iq/android_kernel_c7lte \
            kernel/samsung/c7ltechn

      - name: Download device tree and vendor blobs
        run: |
          curl -L -o c7lte_device_and_vendor.tar.gz \
            https://github.com/AwdndWindowsServer/C7-Lineageos1/releases/download/gg/c7lte_device_and_vendor.tar.gz
          tar -xzf c7lte_device_and_vendor.tar.gz

      - name: Fix device tree configuration
        run: |
          cat > device/samsung/c7ltechn/AndroidProducts.mk << 'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/lineage_c7ltechn.mk

          COMMON_LUNCH_CHOICES := \
              lineage_c7ltechn-userdebug
          EOF

          cat > device/samsung/c7ltechn/device.mk << 'EOF'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)

          PRODUCT_COPY_FILES += \
              $(LOCAL_PATH)/rootdir/etc/fstab.qcom:$(TARGET_COPY_OUT_VENDOR)/etc/fstab.qcom
          EOF

          cat > device/samsung/c7ltechn/lineage_c7ltechn.mk << 'EOF'
          $(call inherit-product, device/samsung/c7ltechn/device.mk)
          $(call inherit-product, vendor/lineage/config/common_full_phone.mk)

          PRODUCT_DEVICE := c7ltechn
          PRODUCT_NAME := lineage_c7ltechn
          PRODUCT_BRAND := samsung
          PRODUCT_MODEL := SM-C7000
          PRODUCT_MANUFACTURER := samsung
          PRODUCT_BUILD_PROP_OVERRIDES += TARGET_DEVICE=c7ltechn PRODUCT_NAME=c7ltechn
          BUILD_FINGERPRINT := samsung/c7ltechn/c7ltechn:8.0.0/R16NW/C7000ZCU2BRB3:user/release-keys

          $(call inherit-product, vendor/samsung/c7ltechn/c7ltechn-vendor.mk)
          EOF

          sed -i '/^TARGET_PREBUILT_KERNEL/d' device/samsung/c7ltechn/BoardConfig.mk

          sed -i \
            's/^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*/CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="msm8953-sec-c7lte_chn-r00 msm8953-sec-c7lte_chn-r01 msm8953-sec-c7lte_chn-r02 msm8953-sec-c7lte_chn-r03 msm8953-sec-c7lte_chn-r04"/' \
            kernel/samsung/c7ltechn/arch/arm64/configs/c7lte_chn_open_defconfig

          cat >> device/samsung/c7ltechn/BoardConfig.mk << 'EOF'

          # LineageOS 18.1 build fixes
          TARGET_IGNORE_DUPLICATE_RULES := true
          TARGET_USES_ION := false
          BOARD_AVB_ENABLE := false
          TARGET_SUPPORTS_64_BIT_APPS := true
          BOARD_KERNEL_CMDLINE += androidboot.selinux=permissive
          SELINUX_IGNORE_NEVERALLOWS := true
          BUILD_QCOM_WLAN_HAL := false
          TARGET_NO_HWCOMPOSER := true

          # Kernel built from source (Samsung 3.18)
          TARGET_KERNEL_SOURCE := kernel/samsung/c7ltechn
          TARGET_KERNEL_CONFIG := c7lte_chn_open_defconfig
          TARGET_KERNEL_ARCH := arm64
          BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb
          EOF

          cat > vendor/samsung/c7ltechn/c7ltechn-vendor.mk << 'EOF'
          PRODUCT_COPY_FILES += \
              vendor/samsung/c7ltechn/proprietary/ueventd.rc:$(TARGET_COPY_OUT_VENDOR)/ueventd.rc \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/bin,$(TARGET_COPY_OUT_VENDOR)/bin) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/etc,$(TARGET_COPY_OUT_VENDOR)/etc) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/firmware,$(TARGET_COPY_OUT_VENDOR)/firmware) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/framework,$(TARGET_COPY_OUT_VENDOR)/framework) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/app,$(TARGET_COPY_OUT_VENDOR)/app) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/lib,$(TARGET_COPY_OUT_VENDOR)/lib) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/lib64,$(TARGET_COPY_OUT_VENDOR)/lib64) \
              $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/bhy_firmware,$(TARGET_COPY_OUT_VENDOR)/bhy_firmware)
          EOF

      - name: Remove obsolete android.*.so blobs
        run: |
          find vendor/samsung/c7ltechn/proprietary/system/ -type f -name 'android.*.so' -delete
          find vendor/samsung/c7ltechn/proprietary -name '*.apk' -delete
          rm -f vendor/samsung/c7ltechn/proprietary/etc/fstab.qcom

      - name: Remove unused qcom hardware trees
        run: |
          rm -rf hardware/qcom-caf/msm8996
          rm -rf hardware/qcom-caf/wlan

      - name: Build LineageOS 18.1
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: |
          source build/envsetup.sh
          lunch lineage_c7ltechn-userdebug
          make -j4 bacon

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: c7ltechn-lineage-18.1
          path: out/target/product/c7ltechn/*.zip
          if-no-files-found: error
