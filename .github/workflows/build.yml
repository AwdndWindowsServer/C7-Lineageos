name: Build LineageOS for SM-C7000
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core repo gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
          bc cpio rsync

    - name: Download LineageOS source (depth 1)
      run: |
        mkdir -p ~/android/lineage
        cd ~/android/lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
        repo sync -c -j4 --no-clone-bundle --no-tags

    - name: Download and extract device/vendor
      run: |
        cd ~/android/lineage
        wget -O c7lte.tar.gz https://github.com/AwdndWindowsServer/C7-Lineageos1/releases/download/gg/c7lte_device_and_vendor.tar.gz
        tar -xzf c7lte.tar.gz

    - name: Fix device tree (minimal viable)
      run: |
        cd ~/android/lineage/device/samsung/c7ltechn

        # AndroidProducts.mk
        cat > AndroidProducts.mk << 'EOF'
        PRODUCT_MAKEFILES := $(LOCAL_DIR)/lineage_c7ltechn.mk
        COMMON_LUNCH_CHOICES := lineage_c7ltechn-userdebug
        EOF

        # 精简 device.mk
        cat > device.mk << 'EOF'
        $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
        
        PRODUCT_PACKAGES += \
            audio.primary.msm8953 \
            audio.r_submix.default \
            audio.usb.default \
            libaudio-resampler \
            libqcomvisualizer \
            libqcomvoiceprocessing \
            libqcompostprocbundle \
            libmm-qcamera \
            Snap \
            libdisplayconfig \
            libqdMetaData \
            libqdutils \
            libsdm-disp-apis \
            libsdmutils \
            libgnsspps \
            libloc_core \
            libloc_ds_api \
            liblocation_api \
            libqmi_cci \
            libqmi_common_so \
            libqmi_csi \
            libqmi_encdec \
            libqmi_qmux \
            libqmiservices \
            libsensor1 \
            libsensor_reg \
            sensors.msm8953 \
            hostapd \
            wpa_supplicant \
            wpa_supplicant.conf \
            power.qcom

        PRODUCT_COPY_FILES += $(LOCAL_PATH)/rootdir/etc/fstab.qcom:$(TARGET_COPY_OUT_VENDOR)/etc/fstab.qcom
        PRODUCT_DEFAULT_PROPERTY_OVERRIDES += ro.usb.vid=04e8 ro.usb.pid=6860
        EOF

        # lineage_c7ltechn.mk
        cat > lineage_c7ltechn.mk << 'EOF'
        $(call inherit-product, device/samsung/c7ltechn/device.mk)
        $(call inherit-product, vendor/lineage/config/common_full_phone.mk)
        PRODUCT_DEVICE := c7ltechn
        PRODUCT_NAME := lineage_c7ltechn
        PRODUCT_BRAND := samsung
        PRODUCT_MODEL := SM-C7000
        PRODUCT_MANUFACTURER := samsung
        PRODUCT_BUILD_PROP_OVERRIDES += TARGET_DEVICE=c7ltechn PRODUCT_NAME=c7ltechn
        BUILD_FINGERPRINT := "samsung/c7ltechn/c7ltechn:8.0.0/R16NW/C7000ZCU2BRB3:user/release-keys"
        $(call inherit-product, vendor/samsung/c7ltechn/c7ltechn-vendor.mk)
        EOF

        # BoardConfig.mk
        cat > BoardConfig.mk << 'EOF'
        TARGET_DEVICE := c7ltechn
        TARGET_BOARD_PLATFORM := msm8953
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_VARIANT := cortex-a53
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv8-a
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := cortex-a53

        BOARD_KERNEL_BASE := 0x80000000
        BOARD_KERNEL_PAGESIZE := 2048
        TARGET_PREBUILT_KERNEL := device/samsung/c7ltechn/prebuilt/Image.gz-dtb

        BOARD_SYSTEMIMAGE_PARTITION_SIZE := 3774873600
        BOARD_CACHEIMAGE_PARTITION_SIZE := 209715200
        BOARD_USERDATAIMAGE_PARTITION_SIZE := 5819009024
        BOARD_BOOTIMAGE_PARTITION_SIZE := 2097152
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 4194304

        BOARD_SYSTEMIMAGE_PARTITION_TYPE := ext4
        BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := ext4
        BOARD_CACHEIMAGE_FILE_SYSTEM_TYPE := ext4
        TARGET_USERIMAGES_USE_EXT4 := true

        BOARD_HAVE_BLUETOOTH := true
        BOARD_HAVE_BLUETOOTH_QCOM := true
        BOARD_USES_ALSA_AUDIO := true
        USE_DEVICE_SPECIFIC_CAMERA := true
        TARGET_SCREEN_DENSITY := 420
        BOARD_WLAN_DEVICE := qcwcn
        TARGET_RECOVERY_FSTAB := device/samsung/c7ltechn/rootdir/etc/fstab.qcom
        BOARD_USES_QCOM_HARDWARE := true

        TARGET_USES_ION := false
        BOARD_AVB_ENABLE := false
        TARGET_SUPPORTS_64_BIT_APPS := true
        BOARD_KERNEL_CMDLINE += androidboot.selinux=permissive
        SELINUX_IGNORE_NEVERALLOWS := true
        BUILD_QCOM_WLAN_HAL := false
        TARGET_NO_HWCOMPOSER := true
        TARGET_IGNORE_DUPLICATE_RULES := true
        EOF

        # fstab
        mkdir -p rootdir/etc
        cat > rootdir/etc/fstab.qcom << 'EOF'
        /dev/block/bootdevice/by-name/system /system ext4 ro,barrier=1 wait,slotselect
        /dev/block/bootdevice/by-name/userdata /data ext4 noatime,nosuid,nodev,barrier=1 wait,check,encryptable=footer
        /dev/block/bootdevice/by-name/cache /cache ext4 noatime,nosuid,nodev,barrier=1 wait,check
        /dev/block/bootdevice/by-name/persist /persist ext4 nosuid,nodev,barrier=1 wait,check
        /dev/block/bootdevice/by-name/boot /boot emmc defaults defaults
        /dev/block/bootdevice/by-name/recovery /recovery emmc defaults defaults
        EOF

        # vendor makefile
        mkdir -p ~/android/lineage/vendor/samsung/c7ltechn
        cat > ~/android/lineage/vendor/samsung/c7ltechn/c7ltechn-vendor.mk << 'EOF'
        PRODUCT_COPY_FILES += \
            $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/system/,$(TARGET_COPY_OUT_SYSTEM)) \
            $(call find-copy-subdir-files,*,vendor/samsung/c7ltechn/proprietary/vendor/,$(TARGET_COPY_OUT_VENDOR))
        EOF

        # 使用绝对路径删除所有可能冲突的文件
        cd ~/android/lineage
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/android.frameworks.schedulerservice@1.0.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/android.frameworks.displayservice@1.0.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib/android.frameworks.schedulerservice@1.0.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib/android.frameworks.displayservice@1.0.so
        
        # 删除预编译的 libfwdlockengine.so，避免与源码编译冲突
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib/drm/libfwdlockengine.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/drm/libfwdlockengine.so
        
        # 删除所有 android.*.so 以防万一
        find vendor/samsung/c7ltechn/proprietary/system -name "android.*.so" -type f -delete 2>/dev/null || true

        # 清空 vendorsetup.sh
        echo "# Legacy file" > vendorsetup.sh

    - name: Build ROM
      run: |
        cd ~/android/lineage
        
        # 再次删除冲突文件（确保）
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/android.frameworks.schedulerservice@1.0.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/android.frameworks.displayservice@1.0.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib/drm/libfwdlockengine.so
        rm -f vendor/samsung/c7ltechn/proprietary/system/lib64/drm/libfwdlockengine.so
        find vendor/samsung/c7ltechn/proprietary/system -name "android.*.so" -type f -delete 2>/dev/null || true
        
        # 移除引起依赖缺失的 HAL 模块
        rm -rf hardware/qcom-caf/msm8996
        rm -rf hardware/qcom-caf/wlan
        
        # 强制允许缺失依赖
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch lineage_c7ltechn-userdebug
        make -j4 bacon ALLOW_MISSING_DEPENDENCIES=true

    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: lineage-18.1-c7ltechn
        path: ~/android/lineage/out/target/product/c7ltechn/*.zip
